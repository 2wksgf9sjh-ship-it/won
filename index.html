<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>CHARACTER PHONE - 양정원</title>
<style>
:root{--blue:#007aff;--paper:#f2f2f7;--ink:#000000;--muted:#8e8e93}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:12px;background:radial-gradient(ellipse at 50% 10%,#1e293b,#0f172a 60%,#020617);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Apple SD Gothic Neo",sans-serif;color:var(--ink)}
button,input,textarea{font:inherit}button{cursor:pointer}

.setup{width:min(420px,100%);background:#fff;border-radius:28px;padding:28px;box-shadow:0 22px 65px #00000050;text-align:center}
.logo{font-size:12px;letter-spacing:3px;font-weight:800;color:#85858c;margin-bottom:8px}
.setup h1{font-size:24px;margin:0 0 10px}
.setup p{font-size:14px;line-height:1.5;color:#666;margin:0 0 20px}
.primary{width:100%;border:0;border-radius:14px;background:#007aff;color:#fff;padding:15px;font-weight:700;font-size:16px;box-shadow:0 4px 12px #007aff40}

.phone{display:none;width:min(390px,95vw);height:min(830px,calc(100dvh - 20px));min-height:620px;background:#000;border:9px solid #1c1c1e;border-radius:54px;padding:8px;box-shadow:0 30px 90px #000000b0;position:relative}
.screen{height:100%;border-radius:44px;overflow:hidden;position:relative;background:#f2f2f7}

.dynamic{position:absolute;z-index:20;top:9px;left:50%;transform:translateX(-50%);width:115px;height:30px;border-radius:20px;background:#000;display:flex;align-items:center;justify-content:flex-end;padding-right:10px}
.dynamic-cam{width:10px;height:10px;border-radius:50%;background:#1a1a1a}
.status{position:absolute;z-index:18;top:0;left:0;right:0;height:44px;padding:12px 26px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:#fff;pointer-events:none}

.view{position:absolute;inset:0;display:none}.view.active{display:block}

.lock{color:#fff;text-align:center;background:linear-gradient(180deg,#0f172a 0%,#1e293b 50%,#334155 100%);background-size:cover}
.lockdate{position:relative;padding-top:100px;font-size:19px;font-weight:500;text-shadow:0 1px 8px #0006}
.locktime{position:relative;font-size:82px;line-height:1.05;font-weight:200;letter-spacing:-3px;text-shadow:0 2px 12px #0005}
.lockmessage{position:relative;margin-top:18px;font-size:15px;font-weight:500;background:#ffffff20;backdrop-filter:blur(12px);display:inline-block;padding:7px 18px;border-radius:20px;box-shadow:0 2px 10px #0003;border:0.5px solid #ffffff30}
.lockbottom{position:absolute;bottom:35px;left:0;right:0;padding:0 30px}
.quick{display:flex;justify-content:space-between;margin-bottom:28px}
.quick button{width:46px;height:46px;border:0;border-radius:50%;background:#ffffff30;color:#fff;font-size:20px;backdrop-filter:blur(15px);display:grid;place-items:center}
.swipe{font-size:13px;opacity:0.8;animation:fade 1.8s infinite}@keyframes fade{50%{opacity:.3}}

.pass{background:#e5e5ea;text-align:center;padding:100px 24px 24px}
.pass h2{font-size:22px;margin:0 0 6px;font-weight:600}
.pass p{font-size:13px;color:#666;margin:0}
.dots{display:flex;justify-content:center;gap:16px;margin:30px 0 32px}
.dot{width:12px;height:12px;border:1.5px solid #333;border-radius:50%}
.dot.on{background:#000}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 20px;max-width:270px;margin:auto}
.key{height:64px;border:0;border-radius:50%;background:#fff;color:#000;font-size:26px;font-weight:400;box-shadow:0 1px 3px #0001}.key:active{background:#d1d1d6}.key.empty{visibility:hidden}
.passfoot{display:flex;justify-content:space-between;max-width:270px;margin:20px auto 0;font-size:13px;color:#555}

.home{padding:75px 22px 30px;background:linear-gradient(160deg,#111827 0%,#374151 50%,#6b7280 100%)}
.greeting{color:#fff;text-shadow:0 2px 10px #0008;font-size:16px;margin:0 4px 28px;font-weight:600}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 14px}
.app{border:0;background:none;color:#fff;text-shadow:0 1px 3px #0008;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;min-width:0;font-weight:500}
.appicon{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;font-size:28px;box-shadow:0 4px 14px #0004;text-shadow:none;position:relative}

.icon-kakao{background:#fee500;color:#3c1e1e;font-weight:bold;font-size:20px}
.icon-insta{background:radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);color:#fff}
.icon-phone{background:linear-gradient(180deg,#34c759,#28a745);color:#fff;font-size:26px}
.icon-messages{background:linear-gradient(180deg,#34c759,#24b046);color:#fff;font-size:26px}
.icon-notes{background:#ffffff;color:#f59e0b;font-size:26px}

.dock{position:absolute;bottom:18px;left:14px;right:14px;padding:12px 16px;border-radius:30px;background:#ffffff35;backdrop-filter:blur(25px);display:flex;justify-content:space-around}
.dock .appicon{width:52px;height:52px}

.appview{background:#fff;padding-top:44px}
.appbar{height:50px;border-bottom:0.5px solid #c6c6c8;display:flex;align-items:center;padding:0 16px;position:relative;background:#f9f9fb}
.back{border:0;background:none;color:var(--blue);font-size:16px;font-weight:500;padding:0;display:flex;align-items:center;gap:3px}
.apptitle{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:16px}
.content{height:calc(100% - 94px);overflow:auto;background:#fff}

.rows{padding:0 12px}
.chatrow{width:100%;display:flex;align-items:center;gap:12px;padding:12px 0;border:0;border-bottom:0.5px solid #e5e5ea;background:#fff;text-align:left}
.avatar{width:48px;height:48px;border-radius:18px;background:#e5e5ea;display:grid;place-items:center;font-size:22px;flex:none}
.chatmeta{flex:1;min-width:0}.chatmeta b{font-size:15px;display:block;margin-bottom:3px}.chatmeta span{font-size:13px;color:#8e8e93;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:11px;color:#8e8e93}
.chatroom{height:100%;display:flex;flex-direction:column;background:#bacee0}
.chatroomtop{height:44px;background:#bacee0;display:grid;place-items:center;font-weight:600;font-size:15px;border-bottom:0.5px solid #a2b8cc}
.bubbles{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:75%;padding:9px 13px;border-radius:16px;background:#fff;font-size:14px;line-height:1.4;align-self:flex-start;box-shadow:0 1px 2px #0001;word-break:break-word}
.bubble.me{background:#fee500;align-self:flex-end}
.composer{padding:8px 10px;background:#eee;display:flex;gap:8px;align-items:center}
.composer input{flex:1;border:1px solid #ddd;border-radius:20px;padding:8px 14px;font-size:14px;background:#fff;outline:none}
.composer button{border:0;background:#fee500;color:#000;font-weight:600;border-radius:16px;padding:8px 14px;font-size:13px}

.insta-profile{padding:16px}
.insta-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.insta-pfp{width:77px;height:77px;border-radius:50%;background:#e5e5ea;overflow:hidden;box-shadow:0 2px 8px #0002;border:1px solid #dbdbdb}
.insta-pfp img{width:100%;height:100%;object-fit:cover}
.insta-counts{display:flex;gap:18px;text-align:center;flex:1;justify-content:space-around;padding-left:10px}
.insta-counts div b{display:block;font-size:16px;font-weight:700}.insta-counts div span{font-size:12px;color:#666}
.insta-bio{font-size:13px;line-height:1.45;margin-bottom:16px}
.insta-bio b{font-size:14px}
.insta-tabs{display:flex;border-top:1px solid #dbdbdb;border-bottom:1px solid #dbdbdb}
.insta-tab{flex:1;text-align:center;padding:10px 0;font-size:20px;color:#000;border-bottom:2px solid #000}
.insta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#fff;padding-top:2px}
.insta-post{aspect-ratio:1;background:#e5e5ea;overflow:hidden;position:relative;cursor:pointer}
.insta-post img{width:100%;height:100%;object-fit:cover;display:block}

.callrow{padding:14px 18px;border-bottom:0.5px solid #e5e5ea;display:flex;justify-content:space-between;align-items:center}
.callrow .name{font-size:15px;font-weight:600}.callrow .sub{font-size:12px;color:#8e8e93;margin-top:2px}
.callrow .tag{font-size:12px;color:#8e8e93}
.missed{color:#ff3b30 !important}

.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);height:5px;width:130px;background:#000;border-radius:10px;z-index:30;cursor:pointer}
.toast{display:none;position:absolute;z-index:40;bottom:70px;left:50%;transform:translateX(-50%);background:#2c2c2e;color:#fff;padding:9px 16px;border-radius:20px;font-size:12px;box-shadow:0 4px 12px #0004}
</style>
</head>
<body>

<section class="setup" id="setup">
 <div class="logo">CHARACTER PHONE</div>
 <h1>양정원의 iPhone</h1>
 <p>21살 대학교 과대 양정원의 스마트폰입니다.<br>비밀번호는 <b>0209</b> 입니다.</p>
 <button class="primary" onclick="begin()">휴대폰 열기</button>
</section>

<main class="phone" id="phone"><div class="screen">
 <div class="dynamic"><div class="dynamic-cam"></div></div>
 <div class="status"><span id="statusTime">12:00</span><span>5G 🔋</span></div>

 <section class="view lock active" id="lock">
   <div class="lockdate" id="date">10월 31일 토요일</div>
   <div class="locktime" id="clock">12:00</div>
   <div class="lockmessage">박여주 ❤️</div>
   <div class="lockbottom">
     <div class="quick"><button onclick="toast('손전등')">🔦</button><button onclick="toast('카메라')">📷</button></div>
     <div class="swipe">위로 쓸어올려 잠금 해제</div>
   </div>
 </section>

 <section class="view pass" id="pass">
   <h2>양정원님의 iPhone</h2>
   <p>암호(0209)를 입력하세요.</p>
   <div class="dots" id="dots"></div>
   <div class="keypad" id="keys"></div>
   <div class="passfoot"><span>긴급통화</span><button class="linkbtn" style="border:0;background:none;color:#007aff;" onclick="erase()">지우기</button></div>
 </section>

 <section class="view home" id="home">
   <div class="greeting">양정원의 iPhone</div>
   <div class="apps">
     <button class="app" onclick="openApp('kakao')"><span class="appicon icon-kakao">TALK</span>카카오톡</button>
     <button class="app" onclick="openApp('instagram')"><span class="appicon icon-insta">📸</span>인스타그램</button>
     <button class="app" onclick="openApp('calls')"><span class="appicon icon-phone">📞</span>전화</button>
     <button class="app" onclick="openApp('messages')"><span class="appicon icon-messages">💬</span>메시지</button>
     <button class="app" onclick="openApp('notes')"><span class="appicon icon-notes">📝</span>메모장</button>
   </div>
   <div class="dock">
     <button class="app" onclick="openApp('calls')"><span class="appicon icon-phone">📞</span></button>
     <button class="app" onclick="openApp('kakao')"><span class="appicon icon-kakao">TALK</span></button>
     <button class="app" onclick="openApp('instagram')"><span class="appicon icon-insta">📸</span></button>
     <button class="app" onclick="openApp('messages')"><span class="appicon icon-messages">💬</span></button>
   </div>
 </section>

 <section class="view appview" id="appview">
   <div class="appbar">
     <button class="back" onclick="home()">‹ 홈</button>
     <span class="apptitle" id="appTitle">앱</span>
   </div>
   <div class="content" id="content"></div>
 </section>

 <div class="toast" id="toast"></div>
 <div class="homebar" onclick="home()"></div>
</div></main>

<script>
let person='양정원', secret='0209', entered='';

let jongseongChat = [
    {sender: '박종성', text: '여주랑 헤어졌어? 여주 다른 애랑 밥 같이 먹던데'}
];

let sunwooChat = [
    {sender: '김선우', text: '너 여자애들이랑 술 마셔도 돼? 여주가 뭐라 안하고?'},
    {sender: '나', text: '괜찮아요. 여주 누나 착해서 ㅋㅋ'},
    {sender: '김선우', text: '헐..'}
];

const $=id=>document.getElementById(id);

function begin(){
    $('setup').style.display='none';
    $('phone').style.display='block';
    dateTime();
    show('lock');
}

function show(id){
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
    $(id).classList.add('active');
}

function dateTime(){
    let d=new Date(), t=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
    $('clock').textContent=t;
    $('statusTime').textContent=t;
    $('date').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+['일요일','월요일','화요일','수요일','목요일','금요일','토요일'][d.getDay()];
}
setInterval(dateTime, 30000); dateTime();

let startY=0;
$('lock').addEventListener('touchstart',e=>startY=e.touches[0].clientY);
$('lock').addEventListener('touchend',e=>{if(startY-e.changedTouches[0].clientY>30)unlock()});
$('lock').addEventListener('click',unlock);

function unlock(){entered=''; drawDots(); show('pass');}
function drawDots(){
    let d=$('dots'); d.innerHTML='';
    for(let i=0;i<secret.length;i++){
        let x=document.createElement('i');
        x.className='dot'+(i<entered.length?' on':'');
        d.append(x);
    }
}
function erase(){entered=''; drawDots();}
function key(k){
    if(k==='del'){entered=entered.slice(0,-1); drawDots(); return;}
    if(entered.length>=secret.length) return;
    entered+=k; drawDots();
    if(entered.length===secret.length){
        if(entered===secret) setTimeout(()=>show('home'), 150);
        else setTimeout(()=>{alert('암호가 올바르지 않습니다. (0209)'); erase();}, 100);
    }
}

(function(){
    ['1','2','3','4','5','6','7','8','9','','0','del'].forEach(k=>{
        let b=document.createElement('button');
        b.className='key'+(!k?' empty':'');
        b.textContent=k==='del'?'⌫':k;
        if(k) b.onclick=()=>key(k);
        $('keys').append(b);
    });
})();

function home(){show('home');}
function toast(s){
    let t=$('toast'); t.textContent=s; t.style.display='block';
    setTimeout(()=>t.style.display='none', 1300);
}

function openApp(which){
    show('appview');
    let title='', body='';

    if(which==='kakao'){
        title='카카오톡';
        let lastJongseong = jongseongChat[jongseongChat.length-1].text;
        let lastSunwoo = sunwooChat[sunwooChat.length-1].text;
        body=`<div class="rows">
            <button class="chatrow" onclick="openChat('박종성')">
                <span class="avatar">🦅</span>
                <span class="chatmeta"><b>박종성 선배</b><span>${lastJongseong}</span></span>
                <span class="time">방금</span>
            </button>
            <button class="chatrow" onclick="openChat('김선우')">
                <span class="avatar">🦊</span>
                <span class="chatmeta"><b>김선우</b><span>${lastSunwoo}</span></span>
                <span class="time">오후 2:15</span>
            </button>
            <button class="chatrow" onclick="openChat('박여주')">
                <span class="avatar">❤️</span>
                <span class="chatmeta"><b>박여주</b><span>우리 헤어져.</span></span>
                <span class="time">어제</span>
            </button>
        </div>`;
    }

    if(which==='instagram'){
        title='Instagram';
        body=`
            <div class="insta-profile">
                <div class="insta-head">
                    <div class="insta-pfp">
                      <img src="https://i.postimg.cc/85zC6X1L/image-4.png" alt="pfp" onerror="this.src='https://i.postimg.cc/prgQd8jS/image-6.png'">
                    </div>
                    <div class="insta-counts">
                        <div><b>3</b><span>게시물</span></div>
                        <div><b>210</b><span>팔로워</span></div>
                        <div><b>3</b><span>팔로잉</span></div>
                    </div>
                </div>
                <div class="insta-bio">
                    <b>양정원</b><br>
                    21 | 대학교 과대 🐱<br>
                    <span style="color:#8e8e93; font-size:12px;">팔로잉: 박여주, 김선우, 박종성</span>
                </div>
                <div class="insta-tabs">
                    <div class="insta-tab">▦</div>
                </div>
                <div class="insta-grid">
                    <div class="insta-post" onclick="viewPhoto(1)"><img src="https://i.postimg.cc/85zC6X1L/image-4.png" alt="photo1"></div>
                    <div class="insta-post" onclick="viewPhoto(2)"><img src="https://i.postimg.cc/P5pM1W2y/image-5.png" alt="photo2"></div>
                    <div class="insta-post" onclick="viewPhoto(3)"><img src="https://i.postimg.cc/prgQd8jS/image-6.png" alt="photo3"></div>
                </div>
            </div>
        `;
    }

    if(which==='calls'){
        title='최근 통화';
        body=`
            <div class="callrow">
                <div><div class="name missed">❤️ 박여주</div><div class="sub">휴대폰</div></div>
                <div class="tag missed">수신 취소 (3)</div>
            </div>
            <div class="callrow">
                <div><div class="name missed">❤️ 박여주</div><div class="sub">휴대폰</div></div>
                <div class="tag missed">부재중 전화</div>
            </div>
            <div class="callrow">
                <div><div class="name">🦅 박종성 선배</div><div class="sub">휴대폰</div></div>
                <div class="tag">발신 통화 · 2분</div>
            </div>
            <div class="callrow">
                <div><div class="name">🦊 김선우</div><div class="sub">휴대폰</div></div>
                <div class="tag">수신 통화 · 5분</div>
            </div>
        `;
    }

    if(which==='messages'){
        title='메시지';
        body=`
            <div class="rows">
                <button class="chatrow" onclick="toast('알림: 단체 문자 메세지입니다.')">
                    <span class="avatar">📢</span>
                    <span class="chatmeta"><b>[과대 공지] 2학년 학과 총회</b><span>내일 오후 6시 정문 앞 연수 갈비...</span></span>
                    <span class="time">오전 10:30</span>
                </button>
            </div>
        `;
    }

    if(which==='notes'){
        title='메모';
        body=`<div style="padding:20px; line-height:1.7;">
            <h3>과대 공지사항 체크</h3>
            <p>• 학과 총회 장소 예약 확인하기<br>• 선우랑 교양 과제 자료 조사하기<br>• 여주 누나한테 연락...</p>
        </div>`;
    }

    $('appTitle').textContent=title;
    $('content').innerHTML=body;
}

function openChat(name){
    $('appTitle').textContent=name;
    renderChat(name);
}

function renderChat(name){
    let chatData = [];
    if(name === '박종성') chatData = jongseongChat;
    else if(name === '김선우') chatData = sunwooChat;
    
    if(name === '박종성' || name === '김선우'){
        let bubblesHtml = chatData.map(c => 
            `<div class="bubble ${c.sender === '나' ? 'me' : ''}">${escapeHtml(c.text)}</div>`
        ).join('');
        
        $('content').innerHTML = `
            <div class="chatroom">
                <div class="chatroomtop">${name}</div>
                <div class="bubbles" id="chatBubbles">${bubblesHtml}</div>
                <div class="composer">
                    <input type="text" id="msgInput" placeholder="메시지 입력..." onkeypress="if(event.key==='Enter') sendMsg('${name}')">
                    <button onclick="sendMsg('${name}')">전송</button>
                </div>
            </div>
        `;
        let b = $('chatBubbles'); b.scrollTop = b.scrollHeight;
    } else if(name === '박여주'){
        $('content').innerHTML = `
            <div class="chatroom">
                <div class="chatroomtop">${name}</div>
                <div class="bubbles">
                    <div class="bubble">우리 헤어져.</div>
                    <div class="bubble me">여주야 잠시만 내 말 좀 들어줘</div>
                    <div class="bubble me">전화 좀 받아주라 제발</div>
                </div>
                <div class="composer"><input type="text" placeholder="전송할 수 없습니다." disabled></div>
            </div>
        `;
    }
}

function sendMsg(name){
    let input = $('msgInput');
    if(!input || !input.value.trim()) return;
    let text = input.value.trim();
    
    if(name === '박종성'){
        jongseongChat.push({sender: '나', text: text});
        renderChat('박종성');
        if(text.replaceAll(' ', '') === '아니요그냥싸웠어요'){
            setTimeout(() => {
                jongseongChat.push({sender: '박종성', text: '아 그렇지?ㅋㅋㅋ 싸우지 마라'});
                renderChat('박종성');
            }, 1000);
        }
    } else if(name === '김선우'){
        sunwooChat.push({sender: '나', text: text});
        renderChat('김선우');
    }
}

function viewPhoto(num){
    const imgs = [
      "https://i.postimg.cc/85zC6X1L/image-4.png",
      "https://i.postimg.cc/P5pM1W2y/image-5.png",
      "https://i.postimg.cc/prgQd8jS/image-6.png"
    ];
    $('appTitle').textContent='게시물';
    $('content').innerHTML=`
        <div style="padding:15px; background:#fff;">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
                <img src="${imgs[0]}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">
                <b>양정원</b>
            </div>
            <div style="width:100%; border-radius:12px; overflow:hidden; border:1px solid #eee;">
                <img src="${imgs[num-1]}" style="width:100%; display:block; object-fit:cover;">
            </div>
            <p style="font-size:14px; margin-top:12px; line-height:1.4;"><b>양정원</b> 정원이의 일상 🐱</p>
            <button onclick="openApp('instagram')" style="border:0; background:#eee; padding:8px 16px; border-radius:12px; margin-top:10px; font-weight:600;">← 돌아가기</button>
        </div>
    `;
}
